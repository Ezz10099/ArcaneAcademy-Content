<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 320" role="img" aria-label="Floating gothic arcane forge">
<defs>
 <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#575364"/><stop offset=".48" stop-color="#323340"/><stop offset="1" stop-color="#131b2b"/></linearGradient>
 <linearGradient id="lit" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#a7a29b"/><stop offset=".45" stop-color="#6d7078"/><stop offset="1" stop-color="#41414f"/></linearGradient>
 <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6b6870"/><stop offset="1" stop-color="#262a38"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#718090"/><stop offset=".45" stop-color="#313d50"/><stop offset="1" stop-color="#111b29"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff0b4"/><stop offset=".28" stop-color="#c69b57"/><stop offset=".7" stop-color="#8e6035"/><stop offset="1" stop-color="#ddad68"/></linearGradient>
 <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5efff"/><stop offset=".35" stop-color="#72bdff"/><stop offset=".7" stop-color="#6264dd"/><stop offset="1" stop-color="#3d306d"/></linearGradient>
 <radialGradient id="fire" cx=".5" cy=".9" r=".9"><stop stop-color="#fff9ba"/><stop offset=".33" stop-color="#ffb649"/><stop offset=".72" stop-color="#e46d24"/><stop offset="1" stop-color="#4c282a"/></radialGradient>
 <radialGradient id="halo"><stop stop-color="#ffb84f" stop-opacity=".6"/><stop offset="1" stop-color="#ff9b30" stop-opacity="0"/></radialGradient>
 <radialGradient id="aura"><stop stop-color="#98d8ff" stop-opacity=".6"/><stop offset="1" stop-color="#7265e4" stop-opacity="0"/></radialGradient>
 <pattern id="masonry" width="26" height="15" patternUnits="userSpaceOnUse"><path d="M0 0H26M0 7.5H26M7 0V7.5M20 7.5V15" fill="none" stroke="#1c2029" stroke-opacity=".34" stroke-width=".8"/><path d="M0 1H26M0 8.5H26" stroke="#e7d5ba" stroke-opacity=".22" stroke-width=".65"/></pattern>
 <pattern id="roof" width="11" height="13" patternUnits="userSpaceOnUse"><path d="M0 0V13M0 5H11" fill="none" stroke="#a4a6af" stroke-opacity=".25" stroke-width=".65"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2"/></filter>
 <style>
 .smoke{transform-box:fill-box;transform-origin:center;animation:drift 6s linear infinite}.s2{animation-delay:-2s}.s3{animation-delay:-4s}
 .spark{animation:rise 2.8s ease-out infinite}.sp2{animation-delay:-.9s}.sp3{animation-delay:-1.8s}
 .flame{animation:flicker 2s ease-in-out infinite alternate}.crystal-light{animation:flicker 4.5s ease-in-out infinite alternate}
 @keyframes drift{0%{opacity:0;transform:translate(0,10px) scale(.55)}20%{opacity:.36}100%{opacity:0;transform:translate(14px,-22px) scale(1.35)}}
 @keyframes rise{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translate(6px,-23px)}}
 @keyframes flicker{from{opacity:.64}to{opacity:1}}
 @media(prefers-reduced-motion:reduce){.smoke,.spark,.flame,.crystal-light{animation:none}.smoke{opacity:.2}.spark{opacity:0}}
 </style>
</defs>
<!-- The island, in the same elevated frontal perspective as the campus. -->
<path d="M39 201 66 181 124 170 208 173 266 191 275 211 250 242 221 254 206 282 185 273 156 313 132 285 119 297 98 266 78 272 64 242 43 230Z" fill="url(#rock)" stroke="#242735" stroke-width="2"/>
<path d="M43 211 78 221 98 266 78 272 64 242ZM94 224 124 231 132 285 119 297 98 266ZM124 231 153 240 156 313 132 285ZM153 240 183 224 185 273 156 313ZM183 224 219 216 206 282 185 273ZM219 216 265 203 250 242 221 254 206 282Z" fill="#0d1628" opacity=".34"/>
<path d="M39 201 66 181 124 170 208 173 266 191 275 211 226 226 153 240 78 221Z" fill="#737078" stroke="#b09b79" stroke-width="1.4"/>
<path d="M48 202 78 188 131 180 211 181 260 195 266 205 224 217 154 231 85 214Z" fill="#96908b" stroke="#373944" stroke-width="1.2"/>
<path d="M49 202 154 231 266 205M75 190 166 216 242 192M105 183 188 209M75 209 141 183M104 217 184 181M153 229 224 186M199 220 256 197" fill="none" stroke="#4a4850" stroke-width="1.1" opacity=".7"/>
<!-- Recessed luminous minerals; faceted, rather than ornamental. -->
<g class="crystal-light" fill="url(#aura)"><ellipse cx="84" cy="251" rx="25" ry="31"/><ellipse cx="181" cy="272" rx="29" ry="31"/><ellipse cx="236" cy="238" rx="23" ry="22"/></g>
<g fill="url(#crystal)" stroke="#a4d9ff" stroke-width=".7"><path d="m71 247 6-19 10 12 3 27-12-7Z"/><path d="m87 255 8-13 6 11-5 18Z"/><path d="m169 269 8-26 11 19-5 29-9-11Z"/><path d="m187 263 10-17 4 12-9 18Z"/><path d="m228 231 7-16 9 13-5 21-9-5Z"/></g>
<path d="M77 228 79 255 90 267M177 243 179 275 183 291M235 215 236 238 239 249" fill="none" stroke="#f0f5ff" stroke-width="1" opacity=".75"/>
<!-- Two rear stone chimneys. -->
<g stroke="#33323c" stroke-width="1.2"><path d="M91 105V42L105 36 118 43V105Z" fill="url(#lit)"/><path d="m105 36 13 7v62h-13Z" fill="url(#shade)"/><path d="M87 43V36l18-7 17 8v7l-17 6Z" fill="url(#gold)"/><path d="m91 36 14-5 13 6-13 5Z" fill="#242531"/>
<path d="M213 104V47l13-6 14 7v63Z" fill="url(#lit)"/><path d="m226 41 14 7v63l-14-7Z" fill="url(#shade)"/><path d="M209 48v-7l17-7 18 8v7l-18 7Z" fill="url(#gold)"/><path d="m213 42 13-5 14 5-14 6Z" fill="#242531"/></g>
<path d="M92 57h25m-25 13h25m-25 13h25m96-21h26m-26 13h26m-26 13h26" stroke="#35323a" opacity=".65" fill="none"/>
<g fill="#b7bdcb"><g class="smoke"><ellipse cx="103" cy="28" rx="9" ry="6"/><ellipse cx="110" cy="22" rx="11" ry="8"/></g><g class="smoke s2"><ellipse cx="105" cy="25" rx="10" ry="7"/><ellipse cx="115" cy="18" rx="13" ry="9"/></g><g class="smoke s3"><ellipse cx="226" cy="33" rx="9" ry="6"/><ellipse cx="234" cy="26" rx="11" ry="8"/></g><g class="smoke s2"><ellipse cx="225" cy="32" rx="7" ry="6"/><ellipse cx="237" cy="22" rx="11" ry="8"/></g></g>
<!-- Multi-level stone workshop and its deep side wall. -->
<path d="M74 116 122 92 224 102 251 119 251 187 224 201 74 199Z" fill="url(#lit)" stroke="#292b36" stroke-width="2"/>
<path d="m224 102 27 17v68l-27 14Z" fill="url(#shade)"/>
<path d="M74 116 122 92 224 102 251 119 251 187 224 201 74 199Z" fill="url(#masonry)"/>
<path d="M69 113 111 88 224 96 256 115 252 124 223 112 111 104 73 126Z" fill="url(#gold)" stroke="#4e3b2e" stroke-width="1"/>
<path d="M66 114 107 67 134 65 222 76 256 114 222 101 112 91Z" fill="url(#metal)" stroke="#222a35" stroke-width="2"/>
<path d="M66 114 107 67 134 65 222 76 256 114 222 101 112 91Z" fill="url(#roof)"/>
<path d="m66 114 41-47 27-2 88 11 34 38M112 91l110 10" fill="none" stroke="url(#gold)" stroke-width="2.8" stroke-linejoin="round"/>
<!-- Raised central gable, gold finial, carved stone arch. -->
<path d="M115 196V111l39-51 40 53v83Z" fill="url(#lit)" stroke="#32323a" stroke-width="2"/>
<path d="M115 196V111l39-51 40 53v83Z" fill="url(#masonry)"/>
<path d="m106 117 48-64 48 64-9 3-39-51-39 51Z" fill="url(#metal)" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
<path d="M154 54V43m-5 8h10" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
<path d="M143 106v-9l11-17 11 17v9Z" fill="#2b333e" stroke="url(#gold)" stroke-width="1.7"/>
<path d="M148 104V98l6-11 6 11v6Z" fill="url(#fire)"/>
<!-- Deep-set orange furnace windows. -->
<g fill="#292630" stroke="url(#gold)" stroke-width="2"><path d="M83 169v-27q0-10 11-21 11 11 11 21v27Z"/><path d="M203 169v-27q0-10 11-21 11 11 11 21v27Z"/><path d="m232 166 11-6v-23l-11-10Z"/></g>
<g class="flame" fill="url(#fire)"><path d="M87 165v-23q0-8 7-15 7 7 7 15v23Z"/><path d="M207 165v-23q0-8 7-15 7 7 7 15v23Z"/><path d="m235 161 5-3v-19l-5-6Z"/></g>
<g class="flame" fill="url(#halo)"><ellipse cx="94" cy="148" rx="21" ry="30"/><ellipse cx="214" cy="148" rx="23" ry="31"/></g>
<path d="M94 130v36m-7-13h14m113-23v36m-7-13h14" stroke="#663822" stroke-width="1.6" fill="none"/>
<!-- Main arch: layered stone voussoirs and restrained bronze trim. -->
<path d="M121 196v-46q0-19 33-39 33 20 33 39v46Z" fill="#373540" stroke="#b7a58b" stroke-width="2"/>
<path d="M128 196v-45q0-15 26-33 26 18 26 33v45Z" fill="url(#gold)" stroke="#514331" stroke-width="1.5"/>
<path d="M133 196v-44q0-13 21-29 21 16 21 29v44Z" fill="url(#metal)" stroke="#292b34" stroke-width="1.5"/>
<path d="M154 127v69M137 158h34M137 188h34" stroke="#a9864b" stroke-width="1.2"/>
<path d="M119 191h12v7h-12Zm58 0h12v7h-12ZM120 147h10v5h-10Zm58 0h10v5h-10Z" fill="url(#gold)"/>
<path d="M121 151h7v39h-7Zm58 0h7v39h-7Z" fill="url(#lit)" stroke="#34353d" stroke-width=".7"/>
<path d="M120 147 125 138 132 130 140 122M188 147l-5-9-7-8-8-8" stroke="#ddd0b7" stroke-width="1.2" fill="none"/>
<!-- Hammer and anvil emblem on the metal door. -->
<g fill="url(#gold)" stroke="#503722" stroke-width=".6"><path d="m144 159 4-4 9 9-4 4-2-2-8 9-3-3 8-9Z"/><path d="M140 176h29l-6 5-5 1v5h5v2h-18v-2h5v-5l-7-2Z"/></g>
<!-- Terrace parapet, steps and working anvil. -->
<path d="M67 198 154 221 246 198 246 205 154 228 67 205Z" fill="url(#shade)" stroke="url(#gold)" stroke-width="1.4"/>
<path d="M132 198h45l-4 7-37 0Zm4 7h37l-4 5h-29Z" fill="url(#lit)" stroke="#35333c" stroke-width=".8"/>
<path d="M81 188h27l-6 5-7 1v5h7v3H84v-3h5v-5l-5-2Z" fill="url(#metal)" stroke="#baa17c" stroke-width="1"/>
<path d="M88 184l5-8 4 3-5 8Zm13-4 4-10 2 1-3 11Z" fill="url(#gold)"/>
<path d="M225 190v9m-7-6v8m15-13v9" stroke="#bda076" stroke-width="1.6"/>
<g class="spark" fill="#ffe1a2"><circle cx="94" cy="123" r="1.6"/><circle cx="212" cy="124" r="1.3"/></g><g class="spark sp2" fill="#ffb45e"><circle cx="88" cy="130" r="1.4"/><circle cx="219" cy="131" r="1.3"/></g><g class="spark sp3" fill="#fff3ca"><circle cx="98" cy="136" r="1.1"/><circle cx="207" cy="137" r="1.2"/></g>
</svg>
